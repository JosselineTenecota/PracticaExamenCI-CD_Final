apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-app
      version: blue
  template:
    metadata:
      labels:
        app: inventario-app
        version: blue
    spec:
      containers:
      - name: inventario-app
        image: ghcr.io/ericksalinas30/inventario-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: APP_COLOR
          value: "blue"
        - name: APP_VERSION
          value: "v1.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-app
      version: green
    template:
      metadata:
        labels:
          app: inventario-app
          version: green
      spec:
        containers:
        - name: inventario-app
          image: ghcr.io/ericksalinas30/inventario-app:latest
          ports:
          - containerPort: 3000
          env:
          - name: APP_COLOR
            value: "green"
          - name: APP_VERSION
            value: "v2.0"